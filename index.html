<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Koolivõrgu arendusmudel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Paigutus: ülal sammuriba (olukord → mudel → eeldused → simulatsioon → stsenaariumid → andmed); iga samm on üks rahulik veerg, kus kaart ja kuus mõõdikut on alati samas kohas. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --soft:#e8eef1; --ink:#15212b; --muted:#566673; --line:#d6dee3;
  --accent:#1b5d7c; --accent-ink:#ffffff; --scen:#a8641c; --good:#2d7a4d; --warn:#a8741a; --bad:#a9443a;
  --t-A:#1b5d7c; --t-B:#5f8fa8; --t-P:#7a6a2e; --t-L:#9aa7b0;
  --f-display:"IBM Plex Serif", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#16202a; --soft:#1d2933; --ink:#e4ebf0; --muted:#94a5b2; --line:#2a3845;
  --accent:#6fb0d3; --accent-ink:#0f161c; --scen:#e2a35c; --good:#62b685; --warn:#ddb056; --bad:#e3826f;
  --t-A:#6fb0d3; --t-B:#4f7f97; --t-P:#c6ad5f; --t-L:#6f7f8b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#16202a; --soft:#1d2933; --ink:#e4ebf0; --muted:#94a5b2; --line:#2a3845;
  --accent:#6fb0d3; --accent-ink:#0f161c; --scen:#e2a35c; --good:#62b685; --warn:#ddb056; --bad:#e3826f;
  --t-A:#6fb0d3; --t-B:#4f7f97; --t-P:#c6ad5f; --t-L:#6f7f8b; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body); margin:0; -webkit-text-size-adjust:100%; text-size-adjust:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
.wrap{max-width:1180px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line)}
.brand{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; padding-block:12px 6px}
.brand h1{font:600 21px/1.2 var(--f-display); margin:0; letter-spacing:.005em}
.proto{font:500 11px/1 var(--f-mono); text-transform:uppercase; letter-spacing:.08em; color:var(--scen); border:1px solid var(--scen); border-radius:3px; padding:4px 6px}
.brand .sub{color:var(--muted); font-size:13px}
nav.steps{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
nav.steps button{flex:0 0 auto; background:none; border:0; border-bottom:2px solid transparent; padding:8px 12px 10px; font:500 14px var(--f-body); color:var(--muted); cursor:pointer; display:flex; gap:7px; align-items:baseline}
nav.steps .expbtn{margin-left:auto; color:var(--muted); font-weight:400; border-left:1px solid var(--line)}
nav.steps .exp{font-weight:400}
.kbar{position:sticky; bottom:12px; z-index:5; margin-top:10px; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 14px; background:var(--surface); border:1px solid var(--accent); border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.12)}
.kbar .small{flex:1; min-width:200px}
.kq{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 14px; font:500 15px/1.35 var(--f-body); color:var(--ink); cursor:pointer}
.kq:hover{border-color:var(--accent)} .kq.on{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
tr.more[hidden]{display:none}
.kqcard{display:grid; gap:12px; border-left:4px solid var(--accent); padding:18px 20px}
.kqtitle{font:600 26px/1.15 var(--f-head, var(--f-body))}
.kqlead{margin:0; font-size:16px; line-height:1.5; max-width:75ch}
.kqbars{display:grid; gap:6px}
.kqbar{display:grid; grid-template-columns:170px minmax(0,1fr) 210px; gap:10px; align-items:center; font-size:14px}
.kqbar .b{height:14px; background:var(--soft); border-radius:3px; overflow:hidden} .kqbar .b i{display:block; height:100%; border-radius:3px}
.kqbar .v{font-variant-numeric:tabular-nums; white-space:nowrap}
.kqfoot{border-top:1px solid var(--line); padding-top:12px}
.kqact{display:grid; gap:2px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:8px 14px; cursor:pointer; color:var(--ink); font:14px var(--f-body); max-width:320px}
.kqact b{color:var(--accent)} .kqact span{font-size:12.5px; color:var(--muted)} .kqact:hover{border-color:var(--accent)}
.kqact.pri{background:var(--accent); border-color:var(--accent)} .kqact.pri b, .kqact.pri span{color:var(--accent-ink)}
@media (max-width:600px){ .kqbar{grid-template-columns:1fr auto} .kqbar .b{grid-column:1 / -1; order:3} }
nav.steps button .n{font:500 11px var(--f-mono); color:var(--muted)}
nav.steps button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
nav.steps button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
main{padding-block:22px 60px}
section.page{display:grid; gap:20px}
h2{font:600 26px/1.2 var(--f-display); margin:0; text-wrap:balance}
h3{font:600 16px/1.3 var(--f-body); margin:0}
.lede{max-width:68ch; color:var(--muted); margin:0}
.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
/* valikuriba */
.picker{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.crumbs{display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:14px}
.crumbs button{background:none; border:0; padding:2px 4px; color:var(--accent); cursor:pointer; font:inherit; border-radius:3px}
.crumbs button[aria-current="true"]{color:var(--ink); font-weight:600; cursor:default}
.crumbs .sep{color:var(--muted)}
.search{flex:1 1 220px; max-width:380px; min-width:0; position:relative}
.search input{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r); background:var(--bg); color:var(--ink); font:inherit}
/* mõõdikud */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:grid; gap:2px; align-content:start; min-width:0}
.kpi .k{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:flex; gap:4px; align-items:center}
.kpi .v{font:500 23px/1.2 var(--f-body); font-variant-numeric:tabular-nums}
.kpi .c{font-size:13px; color:var(--muted)}
.grid2{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:860px){ .grid2{grid-template-columns:minmax(0,1fr)} }
section.page>*{min-width:0}
.summary{font:400 17px/1.55 var(--f-display); max-width:70ch; margin:0}
/* info */
.i{display:inline-grid; place-items:center; width:17px; height:17px; border-radius:50%; border:1px solid var(--muted); color:var(--muted); font:600 11px/1 var(--f-body); cursor:pointer; background:none; padding:0; text-transform:none; letter-spacing:0; vertical-align:1px; flex:0 0 auto}
.i:hover,.i:focus-visible{border-color:var(--accent); color:var(--accent); outline:none}
.pop{position:fixed; z-index:30; max-width:min(380px, calc(100vw - 32px)); background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 8px 28px rgba(0,0,0,.18); padding:12px 14px; font:14px/1.5 var(--f-body)}
.pop b{display:block; margin-bottom:4px; padding-right:26px}
.pop-x{position:absolute; top:6px; right:6px; width:30px; height:30px; border:0; border-radius:50%; background:transparent; color:var(--muted); font:400 22px/1 var(--f-body); cursor:pointer}
.pop-x:hover{background:var(--soft); color:var(--ink)}
/* tabelid */
.tw{overflow-x:auto}
.tbl-wrap{overflow-x:auto; max-width:100%}
table{border-collapse:collapse; width:100%; font-size:14px}
table.pst th.grp{text-align:center; border-bottom:2px solid var(--line)} table.pst .gs{border-left:1px solid var(--line)}
table.pst thead th{text-transform:none; letter-spacing:0; white-space:normal; font-size:13px; line-height:1.3; vertical-align:bottom; color:var(--ink)}
th{font:600 13px/1.3 var(--f-body); color:var(--ink); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); text-transform:none; letter-spacing:0; white-space:normal; vertical-align:bottom}
.thw{display:inline-block; max-width:11ch; white-space:normal; vertical-align:bottom}
th .muted, th .small{font-weight:400}
td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top}
td.r, th.r{text-align:right; font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.cmp td:first-child{color:var(--muted)}
.cmp td.hl{font-weight:600}
.cmp th.scen, .cmp td.scen{color:var(--scen)}
/* sildid */
.lnk{background:none; border:0; padding:0; color:var(--accent); cursor:pointer; font:inherit; font-weight:500; text-align:left; text-decoration:underline; text-underline-offset:2px}
.chip{display:inline-block; font:500 12px/1.4 var(--f-body); padding:1px 7px; border-radius:10px; border:1px solid currentColor; white-space:nowrap}
.c-jatkab{color:var(--good)} .c-laieneb{color:var(--accent)} .c-muutub{color:var(--warn)} .c-liitub{color:var(--bad)}
.imp-suur{color:var(--bad)} .imp-keskmine{color:var(--warn)} .imp-väike{color:var(--muted)}
/* kaart */
.map svg{width:100%; height:auto; display:block}
.map .cty{fill:var(--soft); stroke:var(--surface); stroke-width:1}
.map .kov{fill:var(--soft); stroke:var(--line); stroke-width:.5; cursor:pointer}
.map .kov:hover{fill:var(--line)}
.map .on{fill:color-mix(in srgb, var(--accent) 18%, var(--soft))}
.map circle{cursor:pointer}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--muted); margin-top:8px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px}
/* eeldused */
details.grp{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
details.grp>summary{list-style:none; cursor:pointer; padding:14px 16px; display:flex; gap:10px; align-items:baseline; justify-content:space-between}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary h3::before{content:"▸ "; color:var(--muted)}
details.grp[open]>summary h3::before{content:"▾ "}
.asm{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 16px; padding:10px 16px; border-top:1px solid var(--line); align-items:center}
.asm .lab{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.asm select{padding:6px 8px; border:1px solid var(--line); border-radius:var(--r); background:var(--bg); color:var(--ink); font:inherit; max-width:260px}
.asm.changed select{border-color:var(--scen); color:var(--scen)}
.btn{background:var(--accent); color:var(--accent-ink); border:0; border-radius:var(--r); padding:9px 14px; font:500 14px var(--f-body); cursor:pointer}
.btn.sec{background:none; color:var(--accent); border:1px solid var(--accent)}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.status{font-size:13px; color:var(--muted)}
.status.busy::before{content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--scen); margin-right:6px; animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25} to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .status.busy::before{animation:none} }
/* mudeli skeem */
.flow{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; counter-reset:s}
@media (max-width:900px){ .flow{grid-template-columns:1fr} }
.flow .st{background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--accent); border-radius:var(--r); padding:12px; display:grid; gap:6px; align-content:start}
.flow .st h3{font:600 15px var(--f-body)}
.flow .st .q{font-size:13px; color:var(--muted)}
.flow .st .eg{font-size:13px}
/* stsenaarium */
textarea{width:100%; min-height:84px; padding:10px; border:1px solid var(--line); border-radius:var(--r); background:var(--bg); color:var(--ink); font:inherit; resize:vertical}
.ex{display:flex; flex-wrap:wrap; gap:6px}
.ex button{background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:4px 10px; font:13px var(--f-body); color:var(--ink); cursor:pointer; text-align:left}
.interp{border-left:3px solid var(--scen); padding-left:12px; display:grid; gap:6px}
.rowf{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.rowf select,.rowf input{padding:6px 8px; border:1px solid var(--line); border-radius:var(--r); background:var(--bg); color:var(--ink); font:inherit; max-width:100%}
.answer{font:400 16px/1.6 var(--f-body); white-space:pre-wrap; max-width:75ch}
.bar{height:6px; background:var(--soft); border-radius:3px; overflow:hidden; min-width:60px}
.bar>span{display:block; height:100%; background:var(--accent)}
.note{font-size:13px; color:var(--muted); max-width:85ch}
ol.missing{padding-left:22px; display:grid; gap:12px; margin:0}
ol.missing li{padding-left:4px}
.loading{padding:40px 0; color:var(--muted)}

#v-koolid details.box, #v-koolid details.box > *{min-width:0}
#olist section.box, #olist li, #olist .kpi{min-width:0}
#olist .kpi .c{overflow-wrap:anywhere}
.ava-proto{display:flex; gap:12px; align-items:flex-start; background:color-mix(in srgb, var(--scen) 9%, var(--surface)); border:1px solid color-mix(in srgb, var(--scen) 45%, var(--line)); border-radius:var(--r); padding:12px 14px; font-size:15px; line-height:1.45}
.ava-proto .proto{flex:none; margin-top:2px}
.ava-hero{display:grid; gap:4px; max-width:72ch}
.ava-hero h2{font:600 30px/1.15 var(--f-display); margin:0}
.ava-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media (max-width:1000px){ .ava-grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:600px){ .ava-grid{grid-template-columns:1fr} }
.ava-card{background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--accent); border-radius:var(--r); padding:16px 18px; display:grid; grid-template-rows:auto auto 1fr auto; gap:8px; text-align:left; color:inherit; font:inherit; cursor:pointer; min-width:0}
.ava-card:hover{border-color:var(--accent); box-shadow:0 2px 10px color-mix(in srgb, var(--ink) 8%, transparent)}
.ava-card .big{font:600 32px/1.1 var(--f-body); font-variant-numeric:tabular-nums; color:var(--accent)}
.ava-card .lab{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.ava-card .txt{font-size:14.5px; line-height:1.5}
.ava-card .more{font-size:13px; color:var(--accent)}
.ava-cav{border-left:4px solid var(--warn)}
.ava-cav ul{margin:8px 0 0; padding-left:18px; display:grid; gap:6px; font-size:14.5px; line-height:1.5; max-width:110ch}
.ava-quote{border-left:4px solid var(--accent); padding:6px 0 6px 18px; margin:6px 0 10px}
.ava-quote p{margin:0; max-width:68ch; font:500 20px/1.5 var(--f-display); color:var(--ink)}
@media (max-width:600px){ .ava-quote p{font-size:17px} }
.ava-links{display:flex; flex-wrap:wrap; gap:8px}
@media (max-width:600px){ .ava-hero h2{font-size:24px} .ava-card .big{font-size:28px} .ava-proto{font-size:14px} }
</style>

<script>
/* ---------- abi ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (v,d=0) => v==null||!isFinite(v) ? '–' : Number(v).toLocaleString('et-EE',{minimumFractionDigits:d, maximumFractionDigits:d});
const genit = n => n.replace(/ vald$/,' valla').replace(/ linn$/,' linna').replace(/ vallad$/,' valdade');
const eur = v => v==null||!isFinite(v) ? '–' : nf(v)+' €';
const mln = (v,d=0) => v==null||!isFinite(v) ? '–' : nf(v/1e6,d)+' mln €';
const pct = (v,d=0) => v==null||!isFinite(v) ? '–' : nf(v*100,d)+'%';
const sgn = (v,f) => v==null||!isFinite(v) ? '–' : (v>0?'+':v<0?'−':'')+f(Math.abs(v));
const I = (title, text) => `<button type="button" class="i" data-t="${esc(title)}" data-x="${esc(text)}" aria-label="Selgitus: ${esc(title)}">i</button>`;
const LS = 'kvam1'; const lsGet = (k,d) => { try{ const v=localStorage.getItem(LS+k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lsSet = (k,v) => { try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} };

/* info hüpikaken */
let POPB = null; const popClose = () => { const p=$('#pop'); if (p) p.hidden=true; POPB=null; };
document.addEventListener('pointerdown', e=>{ if (!e.target.closest('#pop') && !e.target.closest('.i')) popClose(); }, true);
addEventListener('scroll', ()=>{ if (POPB) popClose(); }, {passive:true});
document.addEventListener('click', e=>{ if (e.target.closest('.pop-x')){ e.preventDefault(); popClose(); return; }
  const b=e.target.closest('.i'); const p=$('#pop');
  if (!b){ if (!e.target.closest('#pop')) popClose(); return; }
  e.preventDefault(); e.stopPropagation();
  if (POPB===b && !p.hidden){ popClose(); return; } POPB=b;
  p.innerHTML = `<button type="button" class="pop-x" aria-label="Sulge">×</button><b>${esc(b.dataset.t)}</b>${esc(b.dataset.x).replace(/\n/g,'<br>')}`; p.hidden=false;
  const r=b.getBoundingClientRect(), w=Math.min(380, innerWidth-32); let x=Math.min(Math.max(16, r.left-20), innerWidth-w-16), y=r.bottom+8;
  p.style.left=x+'px'; p.style.top=y+'px'; const ph=p.getBoundingClientRect().height; if (y+ph>innerHeight-10) p.style.top=Math.max(10, r.top-ph-8)+'px'; });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') popClose(); });

function zoomable(host, buildSVG, onZoom){
  // buildSVG(): svg sisemine sisu (g), viewBox = GEO; suum muudab viewBoxi
  const W=GEO.w, H=GEO.h; let vb={x:-4, y:-4, w:W+8, h:H+8}; const home={...vb};
  host.innerHTML = `<div style="position:relative"><svg viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" style="width:100%; height:auto; display:block; touch-action:none; cursor:grab" role="img" aria-label="Suumitav kaart">${buildSVG()}</svg>
    <div style="position:absolute; right:8px; top:8px; display:grid; gap:4px"><button class="btn sec" data-z="in" aria-label="Suumi sisse" style="padding:4px 10px; background:var(--surface)">+</button><button class="btn sec" data-z="out" aria-label="Suumi välja" style="padding:4px 10px; background:var(--surface)">−</button><button class="btn sec" data-z="home" aria-label="Kogu Eesti" style="padding:4px 8px; font-size:12px; background:var(--surface)">Eesti</button></div></div>`;
  const svg = host.querySelector('svg'), set = () => { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); if (onZoom) onZoom(svg, home.w/vb.w); };
  const zoomAt = (f, cx, cy) => { const nw=Math.min(home.w, Math.max(home.w/40, vb.w/f)), k=nw/vb.w; vb={x:cx-(cx-vb.x)*k, y:cy-(cy-vb.y)*k, w:nw, h:vb.h*k}; set(); };
  const pt = e => { const r=svg.getBoundingClientRect(); return {x:vb.x+(e.clientX-r.left)/r.width*vb.w, y:vb.y+(e.clientY-r.top)/r.height*vb.h}; };
  svg.addEventListener('wheel', e=>{ e.preventDefault(); const p=pt(e); zoomAt(e.deltaY<0?1.25:0.8, p.x, p.y); }, {passive:false});
  let drag=null, moved=false; const pts=new Map();
  svg.addEventListener('pointerdown', e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); drag={x:e.clientX, y:e.clientY, vb:{...vb}}; moved=false; svg.setPointerCapture(e.pointerId); svg.style.cursor='grabbing'; });
  svg.addEventListener('pointermove', e=>{ if (!drag) return; const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (pts.size===2 && prev){ const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), d0=drag.pd||d; drag.pd=d; const r=svg.getBoundingClientRect(); const c={x:vb.x+((a.x+b.x)/2-r.left)/r.width*vb.w, y:vb.y+((a.y+b.y)/2-r.top)/r.height*vb.h}; if (d0) zoomAt(d/d0, c.x, c.y); moved=true; return; }
    const r=svg.getBoundingClientRect(), dx=(e.clientX-drag.x)/r.width*drag.vb.w, dy=(e.clientY-drag.y)/r.height*drag.vb.h; if (Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4) moved=true; vb={...vb, x:drag.vb.x-dx, y:drag.vb.y-dy}; set(); });
  const end = e=>{ pts.delete(e.pointerId); if (!pts.size){ drag=null; svg.style.cursor='grab'; } };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('click', e=>{ if (moved){ e.stopPropagation(); e.preventDefault(); } }, true);
  host.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ const z=b.dataset.z; if (z==='home'){ vb={...home}; set(); } else zoomAt(z==='in'?1.6:0.625, vb.x+vb.w/2, vb.y+vb.h/2); });
  set(); return {svg, focus:(x,y,w)=>{ vb={x:x-w/2, y:y-w*H/W/2, w, h:w*H/W}; set(); }};
}
/* ---------- kaart: koolitüübid, võrgud, teeninduspiirkonnad ---------- */
const KL = Object.assign({L:0, P:0, G:1, V:1, H:1, mode:'now', area:'G', kov:1}, lsGet('kaart2', {}));
const QC = {hi:'#2f9e57', mid:'#d8b23a', lo:'#d0533f', na:'#9aa7b0'}, QT = {hi:'üle Eesti keskmise', mid:'Eesti keskmise lähedal', lo:'alla Eesti keskmise', na:'andmed puuduvad'};
function span(s){ const g=s.g||[]; let a=-1,b=-1; g.forEach((v,i)=>{ if (v>0){ if (a<0) a=i; b=i; } }); return a<0 ? null : [a+1,b+1]; }
function typeOf(s){ if (s.hev) return 'H'; const sp=span(s); if (!sp) return null; const [a,b]=sp;
  if (a>=10) return '10–12'; if (a>=4 && b<=9) return '7–9'; if (a>=4) return '7–12'; if (b<=4) return '1–4'; if (b<=6) return '1–6'; if (b<=9) return '1–9'; return '1–12'; }
const TYPES = [['1–4','algkool 1.–4. kl'],['1–6','algkool 1.–6. kl'],['1–9','põhikool 1.–9. kl'],['1–12','põhikool ja gümnaasium 1.–12. kl'],['7–9','põhikooli vanem aste 5./7.–9. kl'],['7–12','7.–12. kl'],['10–12','gümnaasium 10.–12. kl'],['V','kutsekool'],['H','HEV-kool (erikool)']];
function shape(t, x, y, r, fill, extra){ const st=`fill="${fill}" stroke="var(--ink)" stroke-width="0.8" vector-effect="non-scaling-stroke" ${extra}`;
  const poly = pts => `<polygon points="${pts.map(p=>p.map(v=>v.toFixed(2)).join(',')).join(' ')}" ${st}/>`;
  if (t==='1–4') return `<circle cx="${x}" cy="${y}" r="${r*0.75}" ${st}/>`;
  if (t==='1–6') return `<circle cx="${x}" cy="${y}" r="${r}" ${st}/>`;
  if (t==='1–9') return `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" ${st}/>`;
  if (t==='1–12') return poly([[x,y-r*1.35],[x+r*1.35,y],[x,y+r*1.35],[x-r*1.35,y]]);
  if (t==='7–9') return poly([[x-r*1.2,y-r],[x+r*1.2,y-r],[x,y+r*1.1]]);
  if (t==='7–12') return poly([[x-r,y-r*0.6],[x,y-r*1.3],[x+r,y-r*0.6],[x+r,y+r],[x-r,y+r]]);
  if (t==='10–12') return poly([[x-r*1.2,y+r],[x+r*1.2,y+r],[x,y-r*1.2]]);
  if (t==='V'){ const p=[]; for (let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*0.55:r*1.35; p.push([x+rr*Math.cos(a), y+rr*Math.sin(a)]); } return poly(p); }
  if (t==='H'){ const w=r*0.45, L=r*1.25; return poly([[x-w,y-L],[x+w,y-L],[x+w,y-w],[x+L,y-w],[x+L,y+w],[x+w,y+w],[x+w,y+L],[x-w,y+L],[x-w,y+w],[x-L,y+w],[x-L,y-w],[x-w,y-w]]); }
  return `<circle cx="${x}" cy="${y}" r="${r}" ${st}/>`; }
function legendShape(t){ return `<svg width="18" height="18" viewBox="-9 -9 18 18" aria-hidden="true" style="vertical-align:-4px">${shape(t,0,0,5,'var(--soft)','')}</svg>`; }
function inNet(s, net){ const sp=span(s); if (!sp) return false; const [a,b]=sp; return net==='L' ? a<=4 : net==='P' ? (a<=9 && b>=7) : net==='G' ? b>=10 : false; }
function qOf(s, net){ const useG = net==='G' || (net!=='P' && net!=='L' && s.lv && s.lv[2]); const e = useG ? s.eg : s.ep, m = useG ? OL.eqMean : OL.pkMean; if (!e) return 'na'; return e[1]>m ? 'hi' : e[2]<m ? 'lo' : 'mid'; }
function vq(v){ const l=v.line; if (!l || l.est==null) return 'na'; const m=OL.vocMed; return l.lo>m ? 'hi' : l.hi<m ? 'lo' : 'mid'; }
function mapPoints(){ // nähtavad punktid valitud võrkudes
  const nets = ['L','P','G'].filter(k=>KL[k]), pts=[];
  if (KL.mode==='ideal' && ST.base){
    ST.base.sites.forEach(si=>{ const lv = new Set(si.kinds.map(k=>k==='L'?'L':k==='P'?'P':'G')); if (!nets.some(n=>lv.has(n))) return;
      const t = lv.has('G') ? (lv.has('L')?'1–12':'10–12') : lv.has('P') ? (lv.has('L')?'1–9':'7–9') : '1–6', s=OL.schools.find(x=>x.n===si.name);
      const net = nets.includes('G')&&lv.has('G') ? 'G' : nets.includes('P')&&lv.has('P') ? 'P' : 'L';
      pts.push({x:si.x, y:si.y, t, q: s?qOf(s, net):'na', n:si.name, N:si.N, nets:[...lv], ideal:si}); }); }
  else OL.schools.filter(s=>s.act && s.xy && s.Y['2025']).forEach(s=>{ const t=typeOf(s); if (!t) return;
    if (t==='H'){ if (KL.H) pts.push({x:s.xy[0], y:s.xy[1], t, q:'na', n:s.n, N:s.Y['2025'][0], nets:[]}); return; }
    const ns = nets.filter(n=>inNet(s,n)); if (!ns.length) return; const net = ns.includes('G')?'G':ns.includes('P')?'P':'L';
    pts.push({x:s.xy[0], y:s.xy[1], t, q:qOf(s,net), n:s.n, N:s.Y['2025'][0], nets:['L','P','G'].filter(n=>inNet(s,n))}); });
  if (KL.V) OL.voc.filter(v=>v.Y['2025'] && v.Y['2025'][1]>0).forEach(v=>pts.push({x:v.xy[0], y:v.xy[1], t:'V', q:vq(v), n:v.n, N:v.Y['2025'][1], nets:['V'], voc:v}));
  return pts; }
function areaCells(){ // teeninduspiirkonnad: lähim sama võrgu kool (Voronoi), lõigatud Eesti piiriga
  const net=KL.area; if (!net || net==='none' || typeof d3==='undefined' || !d3.Delaunay) return '';
  let src;
  if (KL.mode==='ideal' && ST.base) src = ST.base.sites.filter(si=>si.kinds.some(k=>(k==='L'?'L':k==='P'?'P':'G')===net)).map(si=>({x:si.x,y:si.y,q:(OL.schools.find(x=>x.n===si.name)?qOf(OL.schools.find(x=>x.n===si.name),net):'na'),n:si.name}));
  else src = OL.schools.filter(s=>s.act && s.xy && s.Y['2025'] && !s.hev && !s.priv && inNet(s,net)).map(s=>({x:s.xy[0], y:s.xy[1], q:qOf(s,net), n:s.n}));
  { const seen=new Set(); src = src.filter(p=>{ const k=p.x.toFixed(1)+','+p.y.toFixed(1); if (seen.has(k)) return false; seen.add(k); return true; }); }
  if (src.length<3) return '';
  const dl = d3.Delaunay.from(src, p=>p.x, p=>p.y), vo = dl.voronoi([-10,-10,GEO.w+10,GEO.h+10]);
  return `<g clip-path="url(#eeclip)">${src.map((p,i)=>{ const dd=vo.renderCell(i); return dd ? `<path d="${dd}" fill="${QC[p.q]}" fill-opacity=".16" pointer-events="none" stroke="var(--ink)" stroke-opacity=".45" stroke-width=".7" vector-effect="non-scaling-stroke"><title>${esc(p.n)} teeninduspiirkond</title></path>` : ''; }).join('')}</g>`; }

     <label class="rowf" style="gap:5px">Teeninduspiirkonnad ${I('Teeninduspiirkond','Ala, mille lastele on see kool sama võrgu koolidest kõige lähemal (linnulennult). Piir jääb lähima võrreldava kooli piirile. Värv näitab selle kooli edasiõpet.')}<select id="karea"><option value="none">ei näita</option><option value="L" ${KL.area==='L'?'selected':''}>algkoolid</option><option value="P" ${KL.area==='P'?'selected':''}>põhikoolid</option><option value="G" ${KL.area==='G'?'selected':''}>gümnaasiumid</option></select></label>${chk('kov','omavalitsuste piirid')}<span class="status" data-status></span></div></div>

function decTitle(d){
  const H = OL.schools.find(s=>s.n===d.host), hasG = H && H.lv && H.lv[2], mv = Object.entries(d.moves);
  const newG = d.addLv && d.addLv.includes('G') && !hasG;
  const parts = mv.map(([n,l])=>{ const s=OL.schools.find(x=>x.n===n), all = s && ['L','P','G'].filter((k,i)=>s.lv && s.lv[i]).every(k=>l.includes(k));
    return `<b>${esc(n)}</b> ${all?'(kogu kool)':'('+l.map(x=>LVTXT[x]).join(', ')+')'}`; });
  return `${newG?`Uus gümnaasiumiaste koolis <b>${esc(d.host)}</b>: `:`Vastuvõttev kool <b>${esc(d.host)}</b>: `}${parts.join(', ')} ${mv.length>1?'liiguvad':'liigub'} sinna`; }
function decScore(d, pk){ const b=briefOf(d), prio = pk && pk.acc<0.85 ? 2 : 1; return b.co + 0.05*Math.max(0,b.acc)*prio + 0.005*Math.max(0,b.liit); }

/* investeeringud aastate kaupa valitud üksuses: kaks stsenaariumi */
function invYears(lvl, key, nm){
  const el=$('#pgInv'); if (!el) return; const X=ST.base, P=X&&X.PL, u=P ? plU(lvl, lvl==='EE'?'Eesti':key) : null;
  if (!P){ el.innerHTML='<h3>Investeeringud 2027–2033</h3><p class="loading">Arvutan…</p>'; return; }
  if (!u){ el.innerHTML=`<h3>Investeeringud 2027–2033: ${esc(nm)}</h3><p class="small muted">Andmed puuduvad.</p>`; return; }
  const ys=P.years.filter(y=>y<=P.y1), i=y=>y-P.y0, c=y=>u.C[i(y)]+u.H[i(y)], a=y=>u.S0[i(y)]+c(y), b=y=>u.P[i(y)]+u.S[i(y)]+c(y), S=f=>ys.reduce((t,y)=>t+f(y),0);
  const S1 = ASV.kovReact ? 'senine praktika jätkub' : 'tänane koolivõrk säilib';
  el.innerHTML = `<h3>Investeeringud 2027–2033: ${esc(nm)}, mln €</h3>
   <div class="tw"><table class="small"><thead><tr><th rowspan="2">Aasta</th><th class="r" rowspan="2">1) ${S1}</th><th class="grp" colspan="4">2) investeeritakse optimaalse võrgu stsenaariumi järgi</th></tr><tr><th class="r">tasuvad investeeringud</th><th class="r">säilitamine</th><th class="r">otsustatud projektid</th><th class="r">kokku</th></tr></thead><tbody>
   ${ys.map(y=>`<tr><td>${y}</td><td class="r">${nf(a(y)/1e6,1)}</td><td class="r">${nf(u.P[i(y)]/1e6,1)}</td><td class="r">${nf(u.S[i(y)]/1e6,1)}</td><td class="r">${nf(c(y)/1e6,1)}</td><td class="r"><b>${nf(b(y)/1e6,1)}</b></td></tr>`).join('')}
   <tr style="font-weight:600; border-top:2px solid var(--line)"><td>Kokku</td><td class="r">${nf(S(a)/1e6,0)}</td><td class="r">${nf(S(y=>u.P[i(y)])/1e6,0)}</td><td class="r">${nf(S(y=>u.S[i(y)])/1e6,0)}</td><td class="r">${nf(S(c)/1e6,0)}</td><td class="r">${nf(S(b)/1e6,0)}</td></tr></tbody></table></div>
   <p class="note">Stsenaariumis 1 investeeritakse ainult rahuldava õpikeskkonna säilitamisse (halvas seisus vajalik pind osaliselt renoveeritakse, ${nf(X.Q.maintShare||30)}% uusehituse hinnast) ja juba otsustatud projektidesse. Stsenaariumis 2 tehakse lisaks tasuvad investeeringud optimaalsesse võrku ja nendes piirkondades säilitusinvesteeringut ei ole vaja. Üksikasjad on lehel Optimaalne võrk. Summad on 2026. aasta hindades.</p>`;
}

function muuRow(rows, tot){ const S=f=>rows.reduce((t,x)=>t+f(x.r),0), dN=tot.N-S(r=>r.N), da=tot.a.cost-S(r=>r.a.cost), db=tot.b.cost-S(r=>r.b.cost), di0=(tot.iv?tot.iv.T0:0)-S(r=>r.iv?r.iv.T0:0), di=(tot.iv?tot.iv.T:0)-S(r=>r.iv?r.iv.T:0);
  if (Math.abs(dN)<1 && Math.abs(da)<5e4 && Math.abs(di0)<5e4) return '';
  const c=(v,d=1)=>Math.abs(v)>=5e4?nf(v/1e6,d):''; return `<tr class="muted"><td>Eri- ja väikeklassid, jaotamata ${I('Eri- ja väikeklassid','Tavakoolide eri- ja väikeklasside õpilased ja kulud on prognoosis arvestatud maakonna tasemel, mitte koolide kaupa, seega ei ole need omavalitsuste ridadel. Siin on ka riiklikud investeeringud, mida ei saa ühele omavalitsusele jagada. Maakonna kokku-rida sisaldab neid.')}</td><td class="r">${Math.abs(dN)>=1?nf(dN):''}</td><td class="r gs">${c(da)}</td><td></td><td class="r">${c(di0)}</td><td class="r gs">${c(db)}</td><td></td><td class="r">${c(di)}</td><td></td></tr>`; }
const PS = {cty:null};
function scenTable(){
  const el=$('#pgScen'); if (!el) return; const X=ST.base;
  if (!X || !X.PL){ el.innerHTML='<h3>Stsenaariumid 2035</h3><p class="loading">Arvutan…</p>'; return; }
  const P=X.PL, i35=FC.years.indexOf(2035), S1 = ASV.kovReact ? 'senine praktika jätkub' : 'tänane koolivõrk säilib';
  const calc = (l,k) => { const a=fcAt(l,k,i35), b=msAt(l,k,i35), iv=invOf(l,k); if (!a || !(a.N>0)) return null; return {N:a.N, a, b, iv}; };
  const kovsOf = c => [...new Set(OL.schools.filter(s=>(s.mk===c) || (c==='Harju' && s.mk==='Tallinn')).map(s=>s.kov))];
  const keys = PS.cty ? kovsOf(PS.cty).map(k=>['kov',k]) : Object.keys(GEO.c).map(c=>['county',c]);
  const rows = keys.map(([l,k])=>({l,k,r:calc(l,k)})).filter(x=>x.r).sort((a,b)=>b.r.N-a.r.N);
  const tot = PS.cty ? calc('county',PS.cty) : calc('EE','Eesti');
  const pp = o => o.N ? o.cost/o.N : null;
  const tr = (x, strong, click) => { const r=x.r, iv=r.iv||{T0:0,T:0}; return `<tr ${click?`class="click" data-psc="${esc(x.k)}"`:''}${strong?' style="font-weight:600; border-top:2px solid var(--line)"':''}><td>${esc(x.k==='Harju'?'Harju (koos Tallinnaga)':x.k)}${click?' ›':''}</td><td class="r">${nf(r.N)}</td>
    <td class="r gs">${nf(r.a.cost/1e6,1)}</td><td class="r">${nf(pp(r.a))}</td><td class="r">${nf(iv.T0/1e6,1)}</td>
    <td class="r gs"><b>${nf(r.b.cost/1e6,1)}</b></td><td class="r"><b>${nf(pp(r.b))}</b></td><td class="r"><b>${nf(iv.T/1e6,1)}</b></td><td class="r">${r.a.cost-r.b.cost>5e4?nf((r.a.cost-r.b.cost)/1e6,1):'–'}</td></tr>`; };
  el.innerHTML = `<h3>Stsenaariumid 2035 ${PS.cty?'– '+esc(PS.cty==='Harju'?'Harju maakond koos Tallinnaga':PS.cty+' maakond'):'maakondade kaupa'}</h3>
   ${PS.cty?`<p class="small" style="margin:0 0 6px"><a href="#" id="psBack">← Kõik maakonnad</a></p>`:''}
   <div class="tw"><table class="cmp pst small"><thead><tr><th rowspan="2">${PS.cty?'Omavalitsus':'Maakond'}</th><th class="r" rowspan="2">Õpilasi<br>2035</th><th class="grp gs" colspan="3">1) ${S1}</th><th class="grp gs" colspan="3" style="color:var(--accent)">2) investeeritakse optimaalse<br>võrgu stsenaariumi järgi</th><th class="r" rowspan="2">Tegevuskulu<br>kokkuhoid<br>2035, mln €</th></tr>
    <tr><th class="r gs">tegevuskulu<br>2035, mln €</th><th class="r">€ õpilase<br>kohta</th><th class="r">investeeringud<br>2027–2033,<br>mln €</th><th class="r gs">tegevuskulu<br>2035, mln €</th><th class="r">€ õpilase<br>kohta</th><th class="r">investeeringud<br>2027–2033,<br>mln €</th></tr></thead>
   <tbody>${rows.map(x=>tr(x, false, !PS.cty)).join('')}${PS.cty && tot ? muuRow(rows, tot) : ''}${tot?tr({k:PS.cty?(PS.cty==='Harju'?'Harju kokku':PS.cty+' kokku'):'Eesti kokku', r:tot}, true, false):''}</tbody></table></div>
   <p class="note">Tegevuskulu = koolide tegevuskulu (palgad, hoonete ülalpidamine, koolitransport, õpilaskodud) koolide asukoha järgi, ${priceTxt()}. Investeeringud on 2026. aasta hindades: stsenaariumis 1 rahuldava õpikeskkonna säilitamine ja juba otsustatud projektid; stsenaariumis 2 lisaks tasuvad investeeringud optimaalsesse võrku (nendes piirkondades säilitusinvesteeringut ei ole vaja). Optimaalse võrgu kokkuhoid on arvestatud gümnaasiumipiirkonna kaupa ja jagatud omavalitsustele seal elavate laste arvu järgi. Maakonna summas on ka tavakoolide eri- ja väikeklassid, mis on prognoosis maakonna tasemel, ning riiklikud projektid, mida ei saa omavalitsusele jagada (rida „Eri- ja väikeklassid, jaotamata”). ${PS.cty?'':'Klõpsa maakonnal, et näha selle omavalitsusi.'}</p>`;
  const bk=$('#psBack'); if (bk) bk.onclick=e=>{ e.preventDefault(); PS.cty=null; scenTable(); };
  el.querySelectorAll('[data-psc]').forEach(r=>r.onclick=()=>{ PS.cty=r.dataset.psc; scenTable(); el.scrollIntoView({block:'start'}); });

  </div>
  <div class="grid2">
   <div class="box"><h3>Mida tulemused näitavad</h3><ul class="small" style="margin:8px 0 0; padding-left:18px; display:grid; gap:6px">
     <li><b>Investeeringud</b> – raha koolihoonete ehitamiseks ja renoveerimiseks aastatel 2027–2033: tasuvad investeeringud optimaalsesse võrku, rahuldava õpikeskkonna säilitamine ja juba otsustatud projektid. Investeeringud on eraldi koolide tegevuskuludest.</li>
     <li><b>Tegevuskulu õpilase kohta</b> – koolide tegevuskulu, koolitransport ja õpilaskodud, ühe õpilase kohta aastas. <b>Kogukulu õpilase kohta</b> – tegevuskulu + uute investeeringute kapitalikulu (investeering jagatud 40 aastale intressiga). Juba tehtud investeeringuid ei arvestata: need on tehtud kulud, mis ei sõltu sellest, millise stsenaariumi kasuks otsustatakse.</li>
     <li><b>Investeeringu tasuvus</b> – optimaalse võrgu investeeringut võrreldakse 2035. aasta tegevuskulu kokkuhoiuga senise praktikaga võrreldes; tasuv on investeering, mille tootlus on üle laenu hinna (4% aastas).</li>
     <li><b>Koolitee</b> – keskmine aeg kooli algklassides, põhikoolis ja gümnaasiumis.</li>
     <li><b>Ligipääs tugevale gümnaasiumile</b> – kui suur osa gümnaasiumiealistest elab kuni ${ASV.tA||45} minuti kaugusel gümnaasiumist, mille edasiõpe on Eesti keskmisest kõrgem ja gümnaasiumi panus ei ole oodatust madalam (täna) või akadeemilisest gümnaasiumist (mudelis).</li>
     <li><b>Koolipind</b> – kasutusse jääv ja vabanev pind.</li></ul></div>
   <div class="box"><h3>Mida mudel ei arvesta</h3><ul class="small" style="margin:8px 0 0; padding-left:18px; display:grid; gap:6px">
     <li>Laste ja perede koolivalikuid arvestab ainult osaliselt: tõmbekoolid püsivad täis, muidu käib laps talle määratud koolis. Elukoha ja kooli seos ei ole avalik (vt võrdlust allpool).</li>
     <li>HEV-koolide paiknemist ja investeeringuid – HEV-koolid ei ole optimaalse võrgu osa; nende hooned hoitakse mõlemas stsenaariumis rahuldavas seisus ja arvestatud on juba otsustatud HEV-projektid. HEV-koolide tegevuskulu arvutatakse eraldi kulumudeliga (klassi suurus õppekava järgi, õpetaja abid, tugispetsialistid) ja õpilaste arv püsib; see on lehtedel Olukord ja Prognoos ning on mõlemas stsenaariumis sama.</li>
     <li>Kogukonna rolli, koolimaja muid kasutusi ja ajaloolist väärtust.</li>
     <li>Õpetajate liikumist – õpetajate kättesaadavus on ainult taustanäitaja.</li>
     <li>Üleminekuaega: tulemus näitab sihtvõrku 2035. Ajastuse (kohe või lendude kaupa) valib otsustaja; leht „Küsi mudelilt“ (sinu stsenaarium) näitab mõlema mõju.</li></ul></div>
  </div>
  <div class="box"><h3>Kui täpne see on?</h3><p class="small" style="max-width:85ch">Eesti ja piirkondade numbrid on suurusjärgu hinnangud, mille ebakindlus on umbes ±15–25%. Üksiku kooli tulemus on kõige ebakindlam: optimaalses võrgus võivad lähestikku olla mitu peaaegu sama head lahendust, ja mudel valib neist ühe. Seepärast näitab mudel kooli kohta suunda, mitte otsust. Täpsust parandavad kõige rohkem andmed, mis on loetletud vahekaardil „Andmed ja täpsus”.</p></div>
  ${valBox()}`;

function timingHTML(X, unitList, sav){
  const algTo = (X.Q && X.Q.algTo) || 6, G = {L:[...Array(algTo).keys()], P:[6,7,8], G:[9,10,11]}, S = {L:algTo, P:3, G:3};

function msAt(lvl,key,yi){ const b=fcAt(lvl,key,yi); if (!b) return null; const u=plU(lvl,key), P=ST.base&&ST.base.PL; if (!u || !P) return {...b};

  const s = a => a.reduce((x,v,i)=>x+(w[i]?v:0),0); return {P:s(u.P), S:s(u.S), S0:s(u.S0), C:s(u.C)+s(u.H), get T(){ return this.P+this.S+this.C; }, get T0(){ return this.S0+this.C; }}; }

   <div class="box" style="display:grid; gap:10px"><h3>Stsenaarium ${I('Stsenaarium','Fookus = mille tulemusi näidatakse. Muudatused = koolid, mille roll on ette antud. Eeldused = erinevused lehel Eeldused valitud eeldustest. Kõike saab enne arvutamist muuta.')}</h3>
     <div class="rowf"><span class="small muted" style="min-width:70px">Fookus</span><input id="scFocus" list="unitlist" value="${esc(f?(f[0]==='EE'?'Eesti':f[1]):'Eesti')}" style="min-width:240px"></div>
     <div class="rowf"><span class="small muted" style="min-width:70px">Muudatused</span><input id="scAddSch" list="schlist" placeholder="Lisa kool…" style="min-width:240px"><datalist id="schlist">${schoolNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
     ${decRows}
     <div class="rowf"><span class="small muted" style="min-width:70px">Eeldused</span>${parRows||'<span class="small muted">sama mis lehel Eeldused</span>'}${Object.keys(SC.params).length?'<button class="btn sec" id="scClrP">Tühjenda</button>':''}</div>
     <div class="rowf"><button class="btn" id="scRun" ${SC.busy||!ST.base?'disabled':''}>Arvuta</button><span class="small muted">${!ST.base?'Ootan baasarvutust…':''}</span></div></div>
   ${res}
   ${saved.length?`<details class="grp"><summary><h3>Varasemad stsenaariumid</h3><span class="small muted">salvestatud selles brauseris</span></summary>${saved.map((s,i)=>`<div class="asm"><span class="small">${esc(s.t)}</span><button class="btn sec" data-open="${i}">Ava</button></div>`).join('')}</details>`:''}`;
  $('#scFocus').onchange=e=>{ const u=resolveUnit(e.target.value); if (u) SC.focus=u; };
  $('#scAddSch').onchange=e=>{ if (schoolNames().includes(e.target.value)){ SC.decisions.push({name:e.target.value, act:'keep'}); viewStsen(); } };
  el.querySelectorAll('[data-dec]').forEach(s=>s.onchange=()=>{ SC.decisions[+s.dataset.dec].act=s.value; });
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ SC.decisions.splice(+b.dataset.del,1); viewStsen(); });
  const cp=$('#scClrP'); if (cp) cp.onclick=()=>{ SC.params={}; viewStsen(); };
  $('#scRun').onclick=()=>{ const ta=$('#scText'); if (ta) SC.text=ta.value.trim(); if (!SC.focus) SC.focus=['EE','Eesti']; runScen(); };
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ const s=saved[+b.dataset.open]; Object.assign(SC,{text:s.t, focus:s.focus, decisions:s.decisions, params:s.params, interp:s.interp, res:null}); const ta=$('#scText'); if (ta) ta.value=s.t||''; viewStsen(); });
  if (SC.answer && $('#scAnswer')) $('#scAnswer').innerHTML=`<div class="answer">${esc(SC.answer)}</div>`;
}

/* ---------- andmed ja täpsus ---------- */
const MISSING = [
 ['Õpilaste elukohad ja koolid (EHIS)', 'Praegu eeldab mudel, et laps käib talle määratud koolis (välja arvatud tõmbekoolid). Haridussilma järgi jätkab 26% gümnaasiumi minejatest teise omavalitsuse gümnaasiumis, mudel eeldab umbes 18% (vt leht Mudel). Elukoha ja kooli seos näitaks tegelikke koolivalikuid, piiriüleseid õpilasi ja seda, kui palju vanemaid valib kaugema kooli. Samade andmete põhjal saab arvutada ka optimaalsed koolibussiliinid, seega tänaseid liine eraldi vaja ei ole.', 'HTM (EHIS + rahvastikuregister, anonüümitult ruutude kaupa)'],
 ['Kandideerimine gümnaasiumidesse', 'Tõmbekoolid on praegu määratud edasiõppe ja riigigümnaasiumi staatuse järgi ning mudel eeldab ühist konkurssi 3 kohale. Esimese eelistuse kandideerijate arv kooli kohta näitaks tegelikku nõudlust; avalduste koguarv on liiga suur, sest avaldusi saab esitada mitmesse kooli.', 'Koolid, KOVid (ühiskatsed), HTM'],
 ['Gümnaasiumi panuse arvväärtus', 'Haridussilmas on avalik ainult panuse kategooria (viis taset ja eristatavus). Arvväärtus koos usaldusvahemikuga võimaldaks hinnata, kui palju õpilane liitmisest võidab.', 'Harno'],
 ['Rahvastikuprognoos omavalitsuste kaupa', 'Prognoos on praegu maakondade kaupa; eeslinnade ja maapiirkondade vahe on suurim ebakindlus uusehituse vajaduses.', 'Statistikaamet'],
 ['Kutsekoolide kulud, hooned ja õppekohad', 'Kutsekoolide võrk on mudelis fikseeritud (umbes 11 700 noort õppijat): mudel teab õppijate arvu, edasiõpet ja töölesaamist ning õpilaskodusid, kuid mitte koolide kulusid, hoonete pinda ja seisukorda ega õppekohti erialade kaupa. Seetõttu ei saa mudel kutseõpet optimeerida ega kontrollida, kas gümnaasiumi- ja kutseõppe kohti jätkub õppimiskohustuse tõttu kõigile kuni 18. eluaastani. Umbes pool kutseõppijatest on täiskasvanud, mida tuleb arvestada eraldi.', 'HTM: riigi kutseõppeasutuste kulud on HTMi raamatupidamises (SAP) kooli ja õppevaldkonna kaupa olemas, kuid ei ole avalikud – saldoandmikus on need HTMi kuluna koos (Aaviksoo hariduskulude analüüs 2024: 2022. a keskmine jooksevkulu 4150 € õppija kohta, kooliti 1866–18 665 €). Lisaks EHIS, RKAS ja ehitisregister (hooned)'],
 ['Koolihoonete tegelik seisukord', 'Paljudel koolihoonetel puudub energiamärgis; need loetakse praegu halvas seisus olevaks. Hoonete auditid täpsustaksid renoveerimisvajadust (umbes ±300 mln €).', 'KOVid, Riigi Kinnisvara, ehitisregister'],
 ['KOVide investeeringuplaanid', 'Kõigi 79 omavalitsuse eelarvestrateegiate koolihoonete objektid. Praegu on läbi vaadatud suurimad ja kõik riigihanked.', 'KOVid, Rahandusministeerium'],
 ['HEV-koolide tegelikud kulud', 'Koolipõhine kulu on teada ainult ühe HEV-kooli kohta; teiste kulu on arvutatud HEV-koolide kulumudeliga (keskmiselt umbes 13 400 € õpilase kohta). Tegelikud kulud kooli kaupa (sh õpilaskodu ja transport) täpsustaksid HEV-õppe kulu umbes 32 mln € aastas.', 'HTM (riigikoolid), KOVid'],
 ['HEV-õppe vajadus', 'Rajaleidja soovitused omavalitsuste ja erivajaduse liikide kaupa. Ilma nendeta saab HEV-koolide investeeringuvajadust hinnata ainult hoonete seisukorra järgi.', 'Haridus- ja Noorteamet'],
 ['Koolide tegelik kulu kululiikide kaupa', 'Osa koolide kulust on tuletatud omavalitsuse kogukulust. Koolipõhised kulud täpsustaksid tegevuskulu õpilase kohta.', 'KOVid (eelarve täitmine asutuste kaupa)'],
 ['Õpetajate vabad kohad ja pensionile minek', 'Täpsustaks, kus on kvalifitseeritud õpetajaid raske leida.', 'HTM (EHIS), koolid'],

 ['Gümnaasiumi sisseastumise eelistused (SAIS)', 'Näitaks, milliseid gümnaasiume õpilased tegelikult eelistavad.', 'HTM'],
];
function viewAndmed(){
  const X=ST.base, bp=X?X.bp:null;
  $('#v-andmed').innerHTML = `<div><h2>Andmed ja täpsus</h2><p class="lede">Mudel on prototüüp. Allpool on andmed, mis parandaksid täpsust kõige rohkem, olulisuse järjekorras, ning juba otsustatud investeeringud, mida mudel arvestab.</p></div>
   <div class="box"><h3>Puuduvad andmed</h3><ol class="missing" style="margin-top:10px">${MISSING.map(([t,w,s])=>`<li><b>${t}</b><div class="small">${w}</div><div class="small muted">Kust saada: ${s}</div></li>`).join('')}</ol></div>
   <div class="box"><h3>Mida otsustaja peab ise hindama</h3><p class="small" style="max-width:85ch; margin:6px 0 10px">Need ei ole mudeli piirangud, vaid otsuse tegemise tingimused, mis tulenevad seadusest ja kohtupraktikast. Mudel annab nende hindamiseks osa andmeid (koolitee, kulud, kvaliteet), kuid otsuse peab tegema ja põhjendama koolipidaja. See ei ole õigusnõuanne.</p>
    <ol class="missing">
     <li><b>Koolis juba õppivate laste õiguspärane ootus</b><div class="small">Laps võib üldjuhul eeldada, et saab lõpetada kooliastme (6. või 9. klass) samas koolis. Sellest saab kõrvale kalduda kaalukal põhjusel ja tekitatud kahju hüvitades; teine võimalus on muudatus lendude kaupa (PGS § 80 lg 4). Riigikohus 27.11.2025, asi 3-23-885/83.</div></li>
     <li><b>Vanemate ärakuulamine</b><div class="small">Hoolekogu ja õpilasesinduse arvamusest (PGS § 80 lg 1) ei piisa: ära tuleb kuulata kõigi puudutatud laste vanemad. Otsus tuleb teha teatavaks vähemalt viis kuud enne õppeaasta algust ja muudatus saab toimuda 1. juulist 31. augustini (PGS § 80 lg 3 ja 5).</div></li>
     <li><b>Koolitee</b><div class="small">Vähemalt 80% õpilastest ei tohi elukohajärgsesse kooli jõudmiseks kuluda üle 60 minuti (PGS § 7 lg 3) ja ka ülejäänute koolitee ei tohi olla ebamõistlikult pikk. Arvestada tuleb kogu teekonda, sh jalgsi käidavat osa; mudel arvestab bussisõitu koos ootamisega, kuid mitte teed kodust peatusse.</div></li>
     <li><b>HEV-õpilased</b><div class="small">Muudatuse mõju hariduslike erivajadustega õpilastele tuleb eraldi hinnata ja nende olukord ei tohi halveneda. Mudel arvutab HEV-koolide kulu eraldi, kuid ei hinda muudatuste mõju HEV-õpilastele.</div></li>
     <li><b>Laste huvid ja perede kulud</b><div class="small">Lapse huvid on esmased; kokkuhoid peab ületama muudatuse kulud, sh lisanduva transpordi ja perede kulud. Mudel arvestab koolibussi kulu ja koolitee aja väärtust eelduste järgi.</div></li>
     <li><b>Omavalitsuste vahelised kokkulepped</b><div class="small">Vaikimisi ei arvesta optimaalne võrk omavalitsuste piire (vt Eeldused → Optimaalne võrk ja KOV-i piirid): osa lapsi võib käia naabervalla koolis. See eeldab omavalitsuste kokkulepet ja koolikoha kulude hüvitamist; omavalitsus peab tagama põhihariduse omandamise võimaluse oma elanikele (PGS § 10).</div></li>
     <li><b>Kohalikud kokkulepped ja rahastus</b><div class="small">Haldusreformi ühinemislepingud võivad sisaldada koolide säilitamise kokkuleppeid; investeeringuid piirab omavalitsuse laenuvõime. Neid mudel ei kontrolli.</div></li>
    </ol></div>
   ${bp?`<div class="box"><h3>Juba otsustatud ja kavandatud investeeringud ${I('Allikad','Riigieelarve haridus- ja noorteprogramm 2027–2030, riigihangete register ja TED (koolihoonete hanked 2024–2026), KOVide eelarvestrateegiad (Tallinn, Tartu, Pärnu, Rae, Saku, Saue, Saaremaa, Viimsi, Maardu, Keila, Kohtla-Järve) ja ERR. Hinnang = maksumust pole avaldatud.')}</h3>
     <div class="tw"><table><thead><tr><th>Projekt</th><th>Staatus</th><th class="r">Mln €</th><th>Aastad</th></tr></thead><tbody>${bp.commit.map(c=>`<tr><td>${esc(c.name)}${c.hev===true?' <span class="chip">HEV</span>':''}<div class="small muted">${esc(c.who)} · ${esc(c.st)} · <a href="${esc(c.src)}" target="_blank" rel="noopener">allikas</a></div></td><td><span class="chip" style="color:${c.cls==='otsustatud'?'var(--good)':'var(--warn)'}">${c.cls}</span></td><td class="r">${c.residual?'jääk':nf(c.mln,1)}${c.est?'<div class="small muted">hinnang</div>':''}</td><td>${c.y[0]}–${c.y[1]}</td></tr>`).join('')}</tbody></table></div></div>`:''}
   <div class="box"><h3>Allikad</h3><p class="small" style="max-width:85ch">EHIS ja Haridussilm (õpilased, õpetajad, pinnad, edasiõpe, gümnaasiumi panus, rahuloluküsitlus, põhikooli lõpetajate edasiõpe), Statistikaamet (rahvastik, prognoos), Eurostat/GISCO (1 km ruutvõrk, hariduse investeeringud), Maa- ja Ruumiamet (teeregister, ehitisregistri hooned, omavalitsuste piirid), riiklik ühistranspordi andmestik (GTFS), KOVide ja erakoolide aruanded (kulud), riigihangete register ja TED (investeeringud). Koolide kaupa andmed koos märkustega on koolide registris.</p></div>`;
}

/* ---------- vaated ---------- */
function show(v){ if (v!==ST.view) navPush(); showNoPush(v); }
function showNoPush(v){ let scrollK=false, scrollS=false; if (v==='stsen'){ v='kysi'; scrollS=true; } if (v==='koolid'){ v='olukord'; scrollK=true; if (KS.mode==='school' && KS.school){ ST.lvl='kool'; ST.key=KS.school; lsSet('sel',['kool',KS.school]); KS.mode='list'; } } ST.view=v; if (['sim','otsused','kaart'].includes(v)) expShow(true); lsSet('view',v); document.querySelectorAll('nav.steps button').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===v)); document.querySelectorAll('section.page').forEach(s=>s.hidden = !(s.id==='v-'+v || (v==='olukord' && s.id==='v-koolid') || (v==='kysi' && s.id==='v-stsen'))); render(); if (scrollK || scrollS){ const k=$(scrollK?'#v-koolid':'#v-stsen'); setTimeout(()=>k&&k.scrollIntoView({block:'start'}), 30); } else window.scrollTo({top:0}); }
document.querySelectorAll('nav.steps button[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));
function expShow(on){ return;  document.querySelectorAll('nav.steps .exp').forEach(b=>b.hidden=!on); const e=$('#expBtn'); if (e){ e.setAttribute('aria-expanded', on?'true':'false'); e.textContent = on ? 'Detailsed vaated ▴' : 'Detailsed vaated ▾'; } }

function render(){ if (!OL) return; const v=ST.view;
  if (v==='ava') viewAva(); else if (v==='kysi'){ viewKysi(); viewStsen(); } else if (v==='olukord'){ viewOlukord(); viewKoolid(); } else if (v==='kaart') viewKaart(); else if (v==='koolid') viewKoolid(); else if (v==='prognoos') viewPrognoos(); else if (v==='mudel') viewMudel(); else if (v==='eeldused') viewEeldused(); else if (v==='sim') viewSim(); else if (v==='otsused') viewOtsused(); else if (v==='stsen') viewStsen(); else viewAndmed();
  if (!document.getElementById('unitlist')) document.body.insertAdjacentHTML('beforeend', unitList()); }

(async ()=>{
  try{ const [a,b] = await Promise.all([fetch('olukord.json').then(r=>r.json()), fetch('geo.json').then(r=>r.json())]); OL=a; GEO=b; }
  catch(e){ $('#v-olukord').innerHTML='<p>Andmete laadimine ebaõnnestus.</p>'; return; }
  const sel=lsGet('sel',null); if (sel && resolveUnit(sel[1]) || (sel && sel[0]==='EE')){ ST.lvl=sel[0]; ST.key=sel[1]; }
  const v = /^#(ava|olukord|prognoos|sim|otsused|kysi)$/.test(location.hash) ? location.hash.slice(1) : lsGet('view','ava'); showNoPush(['ava','kysi','olukord','koolid','prognoos','mudel','eeldused','sim','otsused','stsen','andmed'].includes(v)?v:'olukord');
  runBase();
  try{ if (window.claude && claude.use){ claude.use('sample').then(s=>{ SAMPLE=s; if (ST.view==='kysi'){ const t=$('#scText'), v=t?t.value:''; viewKysi(); viewStsen(); const t2=$('#scText'); if (t2) t2.value=v; } }); } }catch(e){}
})();

/* tulpade pealkirjad 2–3 reale: pikemad pealkirjad mähitakse kitsamasse plokki */
function thWrap(root){ (root||document).querySelectorAll('th:not([data-w])').forEach(th=>{ th.dataset.w=1; if (th.querySelector('br') || th.classList.contains('grp')) return; const t=th.textContent.trim(); if (t.length>9 && /\s/.test(t)) th.innerHTML=`<span class="thw">${th.innerHTML}</span>`; }); }
new MutationObserver(()=>thWrap(document.querySelector('main'))).observe(document.querySelector('main'), {childList:true, subtree:true});
</script>
